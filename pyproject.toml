[project]
name = "support-agent-evals"
version = "0.1.0"
description = "Customer-support agent with an honest evaluation flywheel on tau2-bench retail"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "tau2",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.12",
    "httpx>=0.27",
    "numpy>=1.26",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
embed = [
    "fastembed>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "mypy>=1.13",
    "playwright==1.64.1",
]

[tool.uv.sources]
tau2 = { path = "third_party/tau2-bench", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_evals"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src/support_evals/llm", "src/support_evals/service"]
