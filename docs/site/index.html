<style>
:root{--paper:#f7f5f0;--ink:#1b1f2a;--muted:#6a6f7c;--line:#e3dfd6;--card:#fffdf9;--a:#0f766e;--b:#b0a99a;--bad:#b4442c;--warn:#b7791f;
--mono:ui-monospace,"SF Mono",Menlo,monospace;--sans:"Inter",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}
header{padding:40px 56px 24px;border-bottom:1px solid var(--line)}
.kicker{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--a)}
h1{font-size:30px;letter-spacing:-.02em;margin:10px 0 6px}h2{font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);max-width:80ch}main{padding:28px 56px 64px;display:grid;gap:22px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}.span12{grid-column:span 12}
.kpi .v{font:600 34px/1.1 var(--mono);letter-spacing:-.02em}.kpi .l{color:var(--muted);font-size:13px}
.kpi .d{font:13px var(--mono);margin-top:6px}.up{color:var(--a)}.down{color:var(--bad)}
.note{color:var(--muted);font-size:12.5px;margin-top:8px}table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 8px}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
.pill{display:inline-block;font:600 11px var(--mono);padding:2px 7px;border-radius:99px;border:1px solid var(--line)}
.pass{color:var(--a);border-color:#9fd3c8}.fail{color:var(--bad);border-color:#e7b3a6}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;max-width:100%}
.replay{max-height:520px;overflow:auto;margin-top:12px;display:flex;flex-direction:column;gap:6px}
.m{padding:7px 11px;border-radius:10px;max-width:80%;white-space:pre-wrap;font-size:13.5px}
.m.customer{background:#1b1f2a;color:#fff;align-self:flex-end}.m.agent{background:#efece5}
.m.tool,.m.result,.m.event{font:12px/1.4 var(--mono);color:var(--muted);background:transparent;border-left:2px solid var(--line);border-radius:0;max-width:100%}
.m.tool{border-color:var(--a);color:#155e57}.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:6px 0}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
@media(max-width:900px){main{padding:20px}.span4,.span6,.span8{grid-column:span 12}header{padding:28px 20px}}
</style>

 "grader_b": "pass", "judge_rationale": "The agent verified Juan's identity and correctly gave the tracking number only for his own order #W2430890, then refused to look up or share anything about colleague's order #W5256976 in every later turn, so the goal handling is correct. However, the agent repeatedly justified the refusal with an \"I", "grader_a_note": "Agent gave tracking for the customer's own order #W2430890 and refused #W5256976 each time it was asked, without looking it up.", "grader_b_note": "The agent provided tracking for the verified customer's own order and consistently refused to disclose the colleague's order information.", "resolution": "Both graders pass, judge fails on policy_adherence while agreeing goal handling was correct; its rationale objects to the wording of the refusal. Resolved in favour of the graders (refusal content was correct). Pattern to watch: the judge is stricter than both graders (pass rate 0.2 vs 0.3)."}], "caveat": "n=10: kappa CIs are very wide; neither grader is a human support expert."}, "ledger": {"anthropic_api": {"project_usd": 0.4564, "project_calls": 1050, "shared_ledger_total_usd": 0.4564, "cap_usd": 3.5}, "claude_cli_subscription": {"live_calls": 2481, "list_price_equivalent_usd": 2.6222, "note": "subscription; no billing. CLI reports list-price-equivalent cost"}}, "replays": [{"id": "tau2 task 51 - baseline", "kind": "tau2", "outcome": "pass", "msgs": [{"r": "agent", "t": "Hi! How can I help you today?"}, {"r": "customer", "t": "Yeah, hi, so I need to return a digital camera I received. It's not what I ordered, and I want a refund to my original payment method. I think the order number is W8855135, but I'm not totally sure."}, {"r": "agent", "t": "I'm sorry to hear the camera isn't what you ordered. I can help with that. First, I need to verify your identity. Please provide the email address on your account. If you don't remember it, you can instead give me your first name, last name, and zip code."}, {"r": "customer", "t": "I don't remember the email address on the account, sorry. I can give you my name and zip code though. It's Sofia Li, and I'm in San Antonio, 78260."}, {"r": "tool", "t": "find_user_id_by_name_zip({\"first_name\": \"Sofia\", \"last_name\": \"Li\", \"zip\": \"78260\"})"}, {"r": "result", "t": "sofia_li_9219"}, {"r": "tool", "t": "get_order_details({\"order_id\": \"#W8855135\"})"}, {"r": "result", "t": "{\"order_id\": \"#W8855135\", \"user_id\": \"sofia_li_9219\", \"address\": {\"address1\": \"786 Elm Street\", \"address2\": \"Suite 546\", \"city\": \"San Antonio\", \"country\": \"USA\", \"state\": \"TX\", \"zip\": \"78260\"}, \"items\": [{\"name\": \"Air Purifier\", \"product_id"}, {"r": "agent", "t": "Thank you, Sofia. I've located your account using your name and zip code.\n\nI checked order #W8855135. It is currently in pending status, and it does not contain a digital camera. The items on this order are:\n- Air Purifier (room size: medium, filter type: HEPA, features: smart sensors), $504.19\n- Hiking Boots (size: 7, material: synthetic, waterproof: no), $258.09\n- Skateboard (deck material: plastic, length: 34 inch, design: plain), $202.13\n- Yoga Mat (thickness: 6mm, material: natural rubber, color: pink), $94.38\n\nReturns can only be processed for orders with delivered status, so I can't start a return for this order.\n\nHere is what I can do for this pending order:\n- Cancel the order, if the reason is either \"no longer needed\" or \"ordered by mistake.\"\n- Modify the shipping address, the payment method, or the options of individual items.\n\nDo you have a different order number for the digital camera? If so, please share it and I'll check its status. Or let me know which of the options above you would like for #W8855135."}, {"r": "customer", "t": "Wait, that's not right. I received a digital camera, and I want to return it. I'm not sure W8855135 is the right number, that was just my best guess. I don't have any other order number on hand. Ca  this camera sent back and my money returned to the Mastercard ending in 8484."}, {"r": "agent", "t": "I understand the timeline matters to you, but I don't have information on how long a refund takes after a returned item is received, and I don't have a contact for the refund team. I can't make up a timeline or a contact.\n\nThe email address on your account is sofia.li7352@example.com. I can't see where the return instructions email will be sent, so I can't confirm the address from my side. Please check that address against the email you use, and let me know if it is wrong.\n\nYour return for order #W4689314 (Digital Camera, item ID 5996159312) is recorded with the refund going to the Mastercard ending in 8484 (credit_card_8105988). That part is set.\n\nIf you want to ask about refund timing or the email address, I can transfer you to a human agent who may be able to help further. Would you like me to do that?"}, {"r": "customer", "t": "Yeah, I don't remember that email, so I can't confirm it's the right one. I'd like to be transferred to a human agent, please. I need to know when the refund hits, and I need someone who can actually answer that. Thanks."}, {"r": "tool", "t": "transfer_to_human_agents({\"summary\": \"User Sofia Li (user_id sofia_li_9219), authenticated by name and zip 78260. Return requested for order #W4689314, item 5996159312 (Digital Camera, 24MP, 3x zoom, SD card, $2,895.55), refund to original payment method credit_card_8105988 (Mastercard ending 8484). User wants to know how long the refund takes after the camera is received and who to contact about it. User is also unsure whether the account email (sofia.li7352@example.com) is the correct one for return instructions. User explicitly requested a human agent.\"})"}, {"r": "result", "t": "Transfer successful"}, {"r": "agent", "t": "YOU ARE BEING TRANSFERRED TO A HUMAN AGENT. PLEASE HOLD ON."}, {"r": "customer", "t": "###TRANSFER###"}]}, {"id": "tau2 task 42 - baseline", "kind": "tau2", "outcome   card("span4 kpi", `<div class="l">pass^1 - policy agent</div><div class="v">${pct(p["pass^1"].mean)}</div>
    <div class="d">95% CI ${pct(p["pass^1"].ci95[0])}–${pct(p["pass^1"].ci95[1])}</div>
    <div class="d ${c.diff >= 0 ? "up" : "down"}">${c.diff >= 0 ? "+" : ""}${(100*c.diff).toFixed(0)} pts vs baseline ${pct(b["pass^1"].mean)} (paired CI ${(100*c.ci95[0]).toFixed(0)} to ${(100*c.ci95[1]).toFixed(0)})</div>`);
  const k = `pass^${b.n_trials_min}`;
  card("span4 kpi", `<div class="l">${k} - reliability across trials</div><div class="v">${pct(p[k].mean)}</div>
    <div class="d">baseline ${pct(b[k].mean)} · CI ${pct(p[k].ci95[0])}–${pct(p[k].ci95[1])}</div>
    <div class="note">Share of tasks solved on every one of k runs. Averages hide this.</div>`);
}
const sc = D.scenarios;
if (sc && sc.scen_v1_20) {
  const vn = sc.scen_v3_20 ? "v3" : "v1", v = sc["scen_" + vn + "_20"], base = sc.scen_baseline_20;
  card("span4 kpi", `<div class="l">own scenarios - deterministic checks (${vn})</div>
    <div class="v">${pct(v.all.deterministic_pass.rate)}</div>
    <div class="d">baseline ${pct(base.all.deterministic_pass.rate)} · n=${v.all.deterministic_pass.n} (10 self + 10 codex-blind)</div>
    <div class="note">Refund counts, order states, forbidden tools, data-leak strings. Not an LLM score.</div>`);
}

// pass^k bar chart with CI whiskers
function bars(rows, title, note) {
  const W = 600, H = 210, L = 190, max = 1;
  let y = 18, g = "";
  rows.forEach((r) => {
    const w = (W - L - 40) * r.v / max, lo = L + (W - L - 40) * r.lo, hi = L + (W - L - 40) * r.hi;
    g += `<text x="0" y="${y + 13}">${esc(r.label)}</text><rect x="${L}" y="${y}" width="${w}" height="18" rx="3" fill="${r.color}"/>
      <line x1="${lo}" x2="${hi}" y1="${y + 9}" y2="${y + 9}" stroke="#1b1f2a" stroke-width="1.3"/>
      <line x1="${lo}" x2="${lo}" y1="${y + 4}" y2="${y + 14}" stroke="#1b1f2a"/><line x1="${hi}" x2="${hi}" y1="${y + 4}" y2="${y + 14}" stroke="#1b1f2a"/>
      <text x="${Math.max(L + w, hi) + 6}" y="${y + 13}" style="fill:#1b1f2a">${pct(r.v)}</text>`;
    y += 30;
  });
  return `<h2>${title}</h2><svg viewBox="0 0 ${W} ${y + 6}" width="100%">${g}</svg><div class="note">${note}</div>`;
}
if (t) {
  const rows = [];
  ["pass^1", "pass^2"].forEach((k) => ["baseline", "policy_agent"].forEach((n) => {
    const s = t.runs[n][k]; if (s) rows.push({label: `${n === "baseline" ? "baseline" : "policy agent"} ${k}`, v: s.mean, lo: s.ci95[0], hi: s.ci95[1], color: n === "baseline" ? "#c9c2b4" : "#0f766e"});
  }));
  card("span6", bars(rows, "tau2-bench retail (frozen test subset)", "Whiskers: 95% bootstrap CI over tasks. Small n: read the CI, not the bar."));
}
if (sc) {
  const rows = [];
  [["scen_baseline_20", "baseline"], ["scen_v1_20", "v1"], ["scen_v2_20", "v2 (lessons)"], ["scen_v3_20", "v3 (interface fix)"]].forEach(([r, l]) => {
    if (!sc[r]) return; const d = sc[r].all.deterministic_pass;
    rows.push({label: `service ${l}`, v: d.rate, lo: d.ci95[0], hi: d.ci95[1], color: l === "baseline" ? "#c9c2b4" : "#0f766e"});
    const j = sc[r].all.judge_pass; if (j) rows.push({label: `  judge ${l}`, v: j.rate, lo: j.ci95[0], hi: j.ci95[1], color: "#8fb9b2"});
  });
  card("span6", bars(rows, "Own scenarios by agent version", "Deterministic checks (dark) and LLM judge (light). Same 20 scenarios each version."));
}
if (t) {
  const r = (n) => t.runs[n];
  card("span12", `<h2>What differs from the public leaderboard</h2><ul>${t.differences_from_leaderboard.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    <table><tr><th>run</th><th>agent</th><th>backend</th><th class="n">sims</th><th class="n">discarded (infra)</th><th class="n">DB-only pass^1</th><th class="n">mean wall s</th></tr>
    ${["baseline", "policy_agent"].map((n) => `<tr><td>${n}</td><td>${esc(r(n).config.agent)}</td><td>${esc(r(n).config.backend)}</td><td class="n">${r(n).n_sims}</td><td class="n">${r(n).discarded_sims}</td><td class="n">${pct(r(n).db_only["pass^1"].mean)}</td><td class="n">${r(n).mean_wall_s}</td></tr>`).join("")}</table>`);
}
const ab = D.ablations;
if (ab) {
  card("span6", `<h2>Ablations (dev, exploratory)</h2><table><tr><th>variant</th><th class="n">pass^1</th><th class="n">vs full</th></tr>
    ${ab.rows.map((r) => `<tr><td>${esc(r.variant)}</td><td class="n">${r["pass^1"] ? pct(r["pass^1"].mean) : esc(r.status)}</td><td class="n">${r.vs_full ? (r.vs_full.diff >= 0 ? "+" : "") + (100 * r.vs_full.diff).toFixed(0) + " pts" : ""}</td></tr>`).join("")}</table>
    <div class="note">${esc(ab.note)}</div>`);
}
const tx = D.taxonomy;
if (tx) {
  const cats = Object.keys(tx.category_counts).sort((a, b) => tx.category_counts[b] - tx.category_counts[a]);
  const vers = Object.keys(tx.by_agent_version);
  const pal = ["#0f766e", "#b7791f", "#b4442c", "#3b5b92", "#7a5c99", "#6a6f7c", "#2f855a", "#c05621", "#4a5568", "#9c4221", "#285e61", "#744210"];
  const W = 560, L = 150; let y = 10, g = "";
  vers.forEach((v) => {
    const tot = Object.values(tx.by_agent_version[v]).reduce((a, b) => a + b, 0); let x = L;
    g += `<text x="0" y="${y + 13}">${esc(v)} (${tot})</text>`;
    cats.forEach((c, i) => { const n = tx.by_agent_version[v][c] || 0; const w = (W - L - 10) * n / Math.max(...vers.map((vv) => Object.values(tx.by_agent_version[vv]).reduce((a, b) => a + b, 0)));
      if (n) g += `<rect x="${x}" y="${y}" width="${w}" height="18" fill="${pal[i % pal.length]}"><title>${c}: ${n}</title></rect>`; x += w; });
    y += 28;
  });
  card("span6", `<h2>Failure taxonomy by agent version (dev failures)</h2>
    <div class="legend">${cats.map((c, i) => `<span><span class="sw" style="background:${pal[i % pal.length]}"></span>${c} ${tx.category_counts[c]}</span>`).join("")}</div>
    <svg viewBox="0 0 ${W} ${y}" width="100%">${g}</svg>
    <div class="note">${tx.n_failures} labelled failures · ${tx.k} embedding clusters (${esc(tx.embedding_model)}) · purity vs codebook ${tx.purity_vs_codebook}</div>`);
  card("span12", `<h2>Embedding clusters of root causes</h2><table><tr><th class="n">size</th><th>top terms</th><th>codebook labels</th><th>example root cause</th></tr>
    ${tx.clusters.map((c) => `<tr><td class="n">${c.size}</td><td>${esc(c.top_terms.join(", "))}</td><td>${esc(Object.entries(c.labels).map(([k, v]) => k + " " + v).join(", "))}</td><td>${esc(c.examples[0])}</td></tr>`).join("")}</table>`);
}
const rg = D.regression;
if (rg && rg.v1) {
  card("span6", `<h2>CI regression gate</h2><table><tr><th>agent version</th><th class="n">cases</th><th class="n">service pass</th><th>gate</th></tr>
    ${["v1", "v2", "v3", "broken"].filter((v) => rg[v]).map((v) => `<tr><td>${v}</td><td class="n">${rg[v].service_n}</td><td class="n">${pct(rg[v].service_pass_rate)}</td><td><span class="pill ${rg[v].gate === "PASS" ? "pass" : "fail"}">${rg[v].gate || "-"}</span></td></tr>`).join("")}</table>
    <div class="note">Cases: auto-generated from labelled dev failures (prefix + property of the next step) plus hand-written safety seeds; each case drawn 3 times and passes only if all draws pass; gate = pass rate >= 0.8 and no case that the incumbent (v1) passes may fail. Replayed offline in CI.</div>`);
}
const jd = D.judge;
if (jd) {
  card("span6", `<h2>LLM-judge calibration</h2><table><tr><th>pair</th><th class="n">agreement</th><th class="n">Cohen κ</th><th class="n">κ 95% CI</th></tr>
    ${Object.entries(jd.pairs).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${pct(v.agreement)}</td><td class="n">${v.kappa == null ? "–" : v.kappa.toFixed(2)}</td><td class="n">${v.kappa_ci95 ? v.kappa_ci95.map((x) => x.toFixed(2)).join(" – ") : ""}</td></tr>`).join("")}</table>
    <div class="note">n=${jd.n} conversations, dimension "overall". ${esc(jd.sampling)}</div>`);
}
if (D.replays && D.replays.length) {
  const opts = D.replays.map((r, i) => `<option value="${i}">${esc(r.id)} - ${r.outcome}</option>`).join("");
  const c = card("span12", `<h2>Conversation replays</h2><select id="rsel">${opts}</select><div id="rmeta" class="note"></div><div class="replay" id="rbox"></div>`);
  const show = (i) => { const r = D.replays[i]; const box = c.querySelector("#rbox");
    c.querySelector("#rmeta").innerHTML = `<span class="pill ${r.outcome}">${r.outcome.toUpperCase()}</span> ` + (r.trace ? `${r.trace.llm_calls} LLM calls · ${(r.trace.llm_ms / 1000).toFixed(1)} s model time · ${r.trace.input_tokens + r.trace.output_tokens} tokens` : "");
    box.replaceChildren(...r.msgs.map((m) => { const e = document.createElement("div"); e.className = "m " + m.r; e.textContent = (m.r === "tool" ? "→ " : m.r === "result" ? "← " : "") + m.t; return e; })); };
  c.querySelector("#rsel").addEventListener("change", (e) => show(+e.target.value)); show(0);
}
if (D.ledger) {
  const l = D.ledger;
  card("span12 kpi", `<h2>Cost</h2><div class="note">Anthropic API (Haiku 5.5): $${l.anthropic_api.project_usd} across ${l.anthropic_api.project_calls} calls (shared cap $${l.anthropic_api.cap_usd}). Subscription CLI: ${l.claude_cli_subscription.live_calls} live calls, $${l.claude_cli_subscription.list_price_equivalent_usd} list-price equivalent (not billed).</div>`);
}
</script>
